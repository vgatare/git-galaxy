<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="git-galaxy — fly through any GitHub repository as an interactive 3D galaxy."
    />
    <meta property="og:title" content="git-galaxy — fly through any repo" />
    <meta
      property="og:description"
      content="Fly through any GitHub repository as a living 3D galaxy. Files are stars, folders are constellations, commits are supernovae."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vgatare.github.io/git-galaxy/" />
    <meta property="og:image" content="https://vgatare.github.io/git-galaxy/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="git-galaxy — fly through any repo" />
    <meta
      name="twitter:description"
      content="Fly through any GitHub repository as a living 3D galaxy. Files are stars, folders are constellations, commits are supernovae."
    />
    <meta name="twitter:image" content="https://vgatare.github.io/git-galaxy/og.png" />
    <title>git-galaxy · fly through any repo</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>

    <div id="loading" class="overlay hidden" aria-live="polite">
      <div class="ring"></div>
      <div id="loading-text">Charting the galaxy…</div>
    </div>

    <header id="hud-top">
      <div class="title">
        <span class="logo">✦</span>
        <span class="brand">git-galaxy</span>
      </div>
      <form id="repo-form" autocomplete="off">
        <input
          id="repo-input"
          name="repo"
          type="text"
          spellcheck="false"
          placeholder="owner/repo  (e.g. torvalds/linux)"
          aria-label="GitHub repository in owner/repo form"
        />
        <button type="submit" id="launch-btn">Launch</button>
      </form>
      <div class="search">
        <input
          id="search-input"
          type="text"
          spellcheck="false"
          placeholder="search files…"
          aria-label="Search files in the loaded repository"
        />
        <div id="search-results" class="search-results hidden" role="listbox"></div>
      </div>
      <div class="hint">
        Try
        <button class="suggest" data-repo="mrdoob/three.js">three.js</button>
        <button class="suggest" data-repo="facebook/react">react</button>
        <button class="suggest" data-repo="vercel/next.js">next.js</button>
        <button class="suggest" data-repo="tailwindlabs/tailwindcss">tailwindcss</button>
        <button class="suggest" data-repo="vgatare/git-galaxy">git-galaxy</button>
      </div>
    </header>

    <aside id="hud-info" class="hidden">
      <div class="info-header">
        <div id="info-name" class="info-name"></div>
        <button id="info-close" aria-label="Close info">×</button>
      </div>
      <div id="info-path" class="info-path"></div>
      <dl id="info-stats" class="info-stats"></dl>
      <button
        id="info-isolate"
        class="info-action hidden"
        aria-label="Isolate this directory's subtree"
      >Isolate subtree</button>
    </aside>

    <div id="isolation-banner" class="isolation-banner hidden" role="status">
      <span>Showing only </span>
      <span id="isolation-path" class="isolation-path"></span>
      <button id="isolation-clear" aria-label="Show the whole galaxy again">
        Show all
        <span class="hint">(a)</span>
      </button>
    </div>

    <aside id="hud-legend" class="hidden">
      <div class="legend-title">Languages</div>
      <ul id="legend-list"></ul>
    </aside>

    <footer id="hud-bottom">
      <div id="meta" class="meta hidden">
        <div class="meta-row">
          <span id="meta-repo" class="meta-repo"></span>
          <span id="meta-stats" class="meta-stats"></span>
        </div>
        <div id="timeline" class="timeline hidden">
          <input
            id="timeline-range"
            type="range"
            min="0"
            max="100"
            value="100"
            step="1"
            aria-label="Commit history scrubber"
          />
          <div id="timeline-label" class="timeline-label"></div>
        </div>
      </div>
      <div class="controls-help">
        drag · orbit ✦ scroll · zoom ✦ hover · inspect ✦ click · focus
      </div>
    </footer>

    <div id="toast" class="toast hidden" role="alert"></div>

    <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
      <div class="viewer-card">
        <header class="viewer-header">
          <div class="viewer-heading">
            <div id="viewer-title" class="viewer-title"></div>
            <div id="viewer-subtitle" class="viewer-subtitle"></div>
          </div>
          <div class="viewer-actions">
            <a id="viewer-github" class="viewer-github" target="_blank" rel="noopener noreferrer" aria-label="Open on GitHub">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
              <span>GitHub</span>
            </a>
            <button id="viewer-close" class="viewer-close" aria-label="Close viewer">×</button>
          </div>
        </header>
        <div id="viewer-body" class="viewer-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
